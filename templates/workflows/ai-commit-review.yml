name: AI Commit Code Review

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  ai-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Get commit diff
        run: |
          git diff HEAD~1 HEAD > reviewbite_diff.txt \
            || git show --format= HEAD > reviewbite_diff.txt

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install OpenAI SDK
        run: npm install --no-save --package-lock=false --ignore-scripts openai@6.0.0

      - name: Run AI review
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node .github/scripts/ai-commit-review.mjs
